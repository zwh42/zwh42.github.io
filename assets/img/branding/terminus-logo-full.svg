<svg width="1200" height="120" viewBox="0 0 1200 120" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <title>Terminus Log Logo</title>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f" />
      <stop offset="50%" stop-color="#000511" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>

    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#00ffff" stroke-width="0.3" opacity="0.1"/>
    </pattern>

    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Circuit rings -->
  <g stroke="#00ffff" stroke-width="1" opacity="0.3" fill="none" filter="url(#glow)">
    <circle cx="100" cy="60" r="35"/>
    <circle cx="1100" cy="60" r="35"/>
    <circle cx="100" cy="60" r="25"/>
    <circle cx="1100" cy="60" r="25"/>
    <circle cx="100" cy="60" r="15"/>
    <circle cx="1100" cy="60" r="15"/>
  </g>

  <!-- Connection lines -->
  <g stroke="#00ffff" stroke-width="0.5" opacity="0.4">
    <line x1="135" y1="60" x2="350" y2="60" stroke-dasharray="5,10"/>
    <line x1="850" y1="60" x2="1065" y2="60" stroke-dasharray="5,10"/>
  </g>

  <!-- Main Title -->
  <g font-family="Arial, sans-serif" font-weight="bold" transform="translate(600, 60)">
    <!-- Shadow layer -->
    <text x="1" y="1" text-anchor="middle" font-size="38" fill="#ff0080" opacity="0.3">
      TERMINUS LOG
    </text>
    <!-- Main text -->
    <text x="0" y="0" text-anchor="middle" font-size="38" fill="#00ffff" filter="url(#glow)">
      <tspan>TERMINUS </tspan>
      <tspan fill="#ff0080">LOG</tspan>
    </text>
  </g>

  <!-- Tech dots -->
  <g fill="#00ffff" opacity="0.7">
    <circle cx="350" cy="60" r="3"/>
    <circle cx="850" cy="60" r="3"/>
    <circle cx="365" cy="60" r="2"/>
    <circle cx="835" cy="60" r="2"/>
  </g>

  <!-- Bottom details -->
  <g stroke="#00ffff" stroke-width="1" opacity="0.5">
    <rect x="540" y="85" width="20" height="2"/>
    <rect x="570" y="85" width="20" height="2"/>
    <rect x="610" y="85" width="20" height="2"/>
    <rect x="640" y="85" width="20" height="2"/>
  </g>

  <!-- Corner indicators -->
  <g fill="#00ffff" opacity="0.3">
    <rect x="10" y="10" width="5" height="5"/>
    <rect x="1185" y="10" width="5" height="5"/>
    <rect x="10" y="105" width="5" height="5"/>
    <rect x="1185" y="105" width="5" height="5"/>
  </g>

</svg>