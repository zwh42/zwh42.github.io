<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120">
  <!-- Transparent background - no background rect -->

  <!-- Circuit circles on the left -->
  <g stroke="#d9c6f0" stroke-width="1" fill="none" opacity="0.4">
    <circle cx="100" cy="60" r="30"/>
    <circle cx="100" cy="60" r="20"/>
    <circle cx="100" cy="60" r="10"/>
  </g>

  <!-- Circuit circles on the right -->
  <g stroke="#d9c6f0" stroke-width="1" fill="none" opacity="0.4">
    <circle cx="1100" cy="60" r="30"/>
    <circle cx="1100" cy="60" r="20"/>
    <circle cx="1100" cy="60" r="10"/>
  </g>

  <!-- Connection lines -->
  <g stroke="#d9c6f0" stroke-width="1" opacity="0.3">
    <line x1="130" y1="60" x2="350" y2="60"/>
    <line x1="850" y1="60" x2="1070" y2="60"/>
  </g>

  <!-- Main text: English -->
  <text x="600" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#d9c6f0">
    TERMINUS LOG <tspan fill="#e891ac">|</tspan> 端点星日志
  </text>

  <!-- Decorative dots -->
  <g fill="#d9c6f0" opacity="0.7">
    <circle cx="350" cy="60" r="3"/>
    <circle cx="850" cy="60" r="3"/>
  </g>

  <!-- Bottom markers -->
  <g stroke="#e891ac" stroke-width="2" opacity="0.5">
    <rect x="540" y="90" width="15" height="3"/>
    <rect x="565" y="90" width="15" height="3"/>
    <rect x="590" y="90" width="15" height="3"/>
    <rect x="615" y="90" width="15" height="3"/>
    <rect x="640" y="90" width="15" height="3"/>
  </g>

</svg>