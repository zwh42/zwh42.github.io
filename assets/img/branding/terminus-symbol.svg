<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <title>Terminus Log Symbol</title>
  <defs>
    <radialGradient id="space-grad" cx="50%" cy="50%" r="80%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#1a237e" />
      <stop offset="60%" stop-color="#0d001a" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <pattern id="tech-grid" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#00e5ff" stroke-width="0.2" opacity="0.3"/>
    </pattern>

    <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <circle cx="50" cy="50" r="48" fill="#000000"/>
  <circle cx="50" cy="50" r="48" fill="url(#space-grad)" opacity="0.7"/>
  <circle cx="50" cy="50" r="48" fill="url(#tech-grid)"/>

  <!-- Outer ring -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="#00e5ff" stroke-width="1" opacity="0.5" filter="url(#neon-glow)"/>

  <!-- Circuit pattern -->
  <g stroke="#00e5ff" stroke-width="1" opacity="0.7" fill="none">
    <!-- Central node -->
    <circle cx="50" cy="50" r="3" fill="#00e5ff"/>

    <!-- T circuit -->
    <path d="M 35 50 L 65 50 M 50 35 L 50 50" stroke-width="1.5"/>
    <circle cx="50" cy="35" r="2" fill="#ff0055"/>

    <!-- L circuit -->
    <path d="M 25 70 L 25 55 L 40 55"/>
    <circle cx="25" cy="70" r="1.5" fill="#00e5ff"/>
  </g>

  <!-- Corner indicators -->
  <g fill="#00e5ff" opacity="0.4">
    <circle cx="20" cy="20" r="1"/>
    <circle cx="80" cy="20" r="1"/>
    <circle cx="20" cy="80" r="1"/>
    <circle cx="80" cy="80" r="1"/>
  </g>

</svg>