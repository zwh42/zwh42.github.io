<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#311e3e" />
      <stop offset="100%" stop-color="#87314e" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Grid pattern -->
  <g stroke="#ffffff" stroke-width="0.5" opacity="0.1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="150" y1="0" x2="150" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="450" y1="0" x2="450" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="750" y1="0" x2="750" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1050" y1="0" x2="1050" y2="630"/>
  </g>

  <!-- Circuit decorations -->
  <g stroke="#ffffff" stroke-width="2" fill="none" opacity="0.3">
    <circle cx="100" cy="100" r="50"/>
    <circle cx="100" cy="100" r="30"/>
    <circle cx="100" cy="100" r="15"/>
    <circle cx="1100" cy="530" r="50"/>
    <circle cx="1100" cy="530" r="30"/>
    <circle cx="1100" cy="530" r="15"/>
  </g>

  <!-- Main title -->
  <text x="600" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="#ffffff">
    Welcome to
  </text>
  <text x="600" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="60" font-weight="bold" fill="#ffffff">
    Terminus Log
  </text>

</svg>