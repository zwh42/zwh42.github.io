<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="theme-color" content="#1f1d1b">
  <script>
    (function () {
      var theme;
      try { theme = localStorage.getItem('terminus-theme'); } catch (e) {}
      document.documentElement.dataset.theme = theme === 'light' ? 'light' : 'dark';
    })();
  </script>
  {% include SEO.html %}
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/img/branding/terminus-mark.svg' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title | escape }}" href="{{ '/feed.xml' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/fonts.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/journal.css' | relative_url }}">
</head>
