<dialog class="search-dialog" id="search-dialog" aria-labelledby="search-heading" data-search-url="{{ '/search.json' | relative_url }}">
  <div class="search-dialog-heading"><h2 id="search-heading">搜索文章</h2><button class="icon-button search-close" type="button" aria-label="关闭搜索">✕</button></div>
  <label class="sr-only" for="search-input">搜索标题、标签或正文</label>
  <input type="search" id="search-input" class="search-field" placeholder="搜索标题、标签或正文" autocomplete="off">
  <p id="search-status" class="search-status" role="status">输入关键词，搜索标题、标签和正文。</p>
  <ul id="results-container" class="search-results"></ul>
  <p class="search-hint"><kbd>Esc</kbd> 关闭 <span aria-hidden="true">/</span> <kbd>⌘ / Ctrl K</kbd> 搜索</p>
</dialog>
