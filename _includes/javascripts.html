<script src="{{ '/assets/js/journal.js' | relative_url }}" defer></script>
{% if site.extensions.mermaid_enable and page.mermaid %}
<script src="{{ '/assets/js/mermaid.min.js' | relative_url }}"></script>
<script>mermaid.initialize({ startOnLoad: true, theme: document.documentElement.dataset.theme === 'dark' ? 'dark' : 'default' });</script>
{% endif %}
{% if page.math or page.mathjax %}
<script>window.MathJax = {tex: {inlineMath: [['$', '$'], ['\\(', '\\)']]}};</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<script defer src="{{ '/assets/js/math-layout.js' | relative_url }}"></script>
{% endif %}
