<header class="site-header">
  <div class="header-top">
    <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="端点星日志，首页"><span class="terminal-path" aria-hidden="true">~/</span>{{ site.title | escape }}<span class="terminal-cursor" aria-hidden="true"></span></a>
    <div class="header-tools">
      <button class="icon-button search-open" type="button" aria-label="搜索文章" aria-haspopup="dialog"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg></button>
      <button class="icon-button" id="theme-button" type="button" aria-label="切换浅色模式" aria-pressed="true"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16Z" fill="currentColor"/></svg></button>
    </div>
  </div>
  <nav class="site-nav" aria-label="主导航">
    {% for item in site.data.navigation.main %}<a href="{{ item.url | relative_url }}"{% if page.url == item.url or item.url == '/categories/' and page.url == '/archive/' or item.url == '/categories/' and page.url == '/blog/' or item.url == '/categories/' and page.url == '/category/' or item.url == '/categories/' and page.url == '/tags/' or item.url == '/categories/' and page.url == '/tag/' %} aria-current="page"{% endif %}>{{ item.title }}</a>{% endfor %}
  </nav>
</header>
