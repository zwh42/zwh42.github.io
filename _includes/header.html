<header class="site-header">
  <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="端点星日志，首页">端点星日志</a>
  <nav class="site-nav" aria-label="主导航">
    {% for item in site.data.navigation.main %}<a href="{{ item.url | relative_url }}"{% if page.url == item.url or item.url == '/archive/' and page.layout == 'post' or item.url == '/archive/' and page.url == '/blog/' %} aria-current="page"{% endif %}>{{ item.title }}</a>{% endfor %}
  </nav>
  <div class="header-tools">
    <button class="icon-button search-open" type="button" aria-label="搜索文章" aria-haspopup="dialog"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg></button>
    <button class="icon-button" id="theme-button" type="button" aria-label="切换深色模式" aria-pressed="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16Z" fill="currentColor"/></svg></button>
  </div>
</header>
