title: Zhaowenhao's Homepage
email: your-email@example.com
description: >-
  Welcome to my personal homepage.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://zwh42.github.io" # the base hostname & protocol for your site, e.g. http://example.com

# Build settings
markdown: kramdown
theme: minima

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Minima settings
minima:
  skin: auto

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .gitignore
  - .github
  - .devcontainer
  - Dockerfile
  - docker-compose.yaml 