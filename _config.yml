# Site settings
title: 端点星日志
lang: zh-CN
description: "泥上偶然留指爪，鸿飞那复计东西。"
permalink: ':title:output_ext'
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://zwh42.github.io" # the base hostname & protocol for your site, e.g. http://example.com
logo: "/assets/img/branding/terminus-logo-simple.svg"
logo-icon: "/assets/img/branding/terminus-symbol.svg"
logo-icon-SEO: "/assets/img/branding/terminus-favicon.png" # must be a non SVG file

# Dark by default; visitors can save a light/dark preference in the header.
logo-dark: "/assets/img/branding/terminus-logo-simple-dark.svg"
highlight_theme: syntax-base16.monokai.dark # select a dark theme for the code highlighter if needed

# Author settings
author: 端点星日志
author-pic: /assets/images/profile.svg
about-author: 端点星日志
default_post_image: posts/welcome.svg

defaults:
  - scope:
      path: ""
      type: posts
    values:
      author: 端点星日志

# Contact links
email: # Add your Email address
phone: # Add your Phone number
website: https://zwh42.github.io # Add your website
linkedin: # Add your Linkedin handle
github: zwh42 # Add your Github handle
twitter: # Add your Twitter handle
bandcamp: # Add your Bandcamp username
stackoverflow: # Add your stackoverflow account

# Newsletter
# mailchimp: "https://github.us1.list-manage.com/subscribe/post?u=8ece198b3eb260e6838461a60&amp;id=397d90b5f4"

# Tracker
# analytics: G-R8SZS2YBZK
# fbadmin: ar.maybach

# Paginate
paginate: 6
paginate_path: 'page:num'
words_per_minute: 200

extensions:
  mermaid_enable: true

# Comments
comments: utteranc  #[disqus, utteranc]
comments_opts:
  comments_curtain: yes # leave empty to show the disqus embed directly
  repo: # The GitHub repo URL.  https://utteranc.es/
  issue_term: # The GitHub issue label
  label: # The GitHub comments label
  theme: # The GitHub comment's there. e.g. github-dark
  # Disqus
  discus_identifier: # Add your discus identifier

# Build settings
markdown: kramdown
mathjax: true
highlighter: rouge
compress_html:
  clippings: all
  comments: all
  startings: [html, head, body]

# Outputting
timezone: Asia/Shanghai # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones

category_archive:
  type: liquid
  path: /categories/

sass:
  style: compressed

plugins:
  - jekyll-paginate
  - jekyll-feed
  - jekyll-sitemap

include: [_pages]
exclude: ["node_modules", "gulpfile.js", "package.json", "yarn.lock", "package-lock.json", "assets/css/sass/", "design.md", ".hallmark", "vendor", "Gemfile", "Gemfile.lock"]
